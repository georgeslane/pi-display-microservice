[project]
name = "pi-display-microservice"
version = "0.1.0"
description = "Athena's status board: what the assistant is doing, on a Pimoroni Display HAT Mini."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11",
    # The Display HAT Mini's drivers, which only build on Linux. Everything else, and the
    # tests, run on any computer.
    "st7789>=1.0.1; sys_platform == 'linux'",
    "gpiod>=2.2; sys_platform == 'linux'",
    "gpiodevice>=0.1; sys_platform == 'linux'",
]

[project.scripts]
pi-display-microservice = "pi_display_microservice.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_display_microservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
