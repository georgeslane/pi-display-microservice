# pi-display-microservice settings. Copy to config.toml (install.sh does this) and edit.
# Every setting is optional: the defaults work with the board's plugin in Hermes, as
# scripts/install-hermes-plugin.sh sets it up.

# Where the plugin serves Hermes' status: PI_DISPLAY_HOST and PI_DISPLAY_PORT in
# ~/.hermes/.env, if you've set them. (Older config files call this athena_url, which works too.)
hermes_url = "http://127.0.0.1:8091"

# Only if you've set PI_DISPLAY_TOKEN in ~/.hermes/.env: the same one here.
token = ""

# The LED: blue while Hermes works, flashing amber when it needs you. false keeps it off.
led = true

# The name on the board, and the clock's timezone. Empty means "Hermes", and this machine's.
name = ""
timezone = ""

# The photo page: a Google Photos album's share link. In Google Photos, open the album,
# choose Share, then Create link. Anyone with the link can see the album, so keep it here,
# where git can't reach it. Empty means no photo page.
album_url = ""
